name: Commit hygiene

on:
  pull_request:

jobs:
  no-ai-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The local .githooks/commit-msg hook rejects these at commit time, but it
      # cannot see the boundary that actually matters: GitHub composes the
      # squash-merge message server-side by concatenating every commit in the PR,
      # so a trailer in any one of them still lands on the default branch. Fail
      # the PR instead, naming the offending commits.
      - name: Reject AI-authorship attribution in commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='co-authored-by:[[:space:]]*claude|generated with \[?claude code'
          failed=0
          for sha in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            if git log -1 --format='%B' "$sha" | grep -qiE "$pattern"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") — carries AI-authorship attribution"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "Rewrite the offending commit messages (git rebase -i) and force-push."
            exit 1
          fi
          echo "No AI-authorship attribution found."
